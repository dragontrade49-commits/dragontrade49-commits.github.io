<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Trang cá nhân</title>
        <style>
            body {
                margin: 0;
                font-family: Arial, sans-serif;
                background-color: #f0f2f5;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }
            .profile-card {
                background-color: white;
                width: 300px;
                padding: 30px;
                border-radius: 10px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                text-align: center;
                transition: transform 0.3s ease, box-shadow 0.3s ease;
            }
            .profile-card:hover {
                transform: translateY(-5px); 
                box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15); 
            }
            .avata {
                width: 100px;
                height: 100px;
                border-radius: 50%;
                margin-bottom: 15px;
                object-fit: cover;
                transition: transform 0.3s ease;
            }
            .profile-card:hover .avata {
                transform: scale(1.05);
            }
            .name {
                margin: 0 0 15px 0;
                font-size: 24px;
                color: #333;
            }
            .title {
                margin: 0 0 15px 0;
                font-size: 14px;
                color: #777;
            }
            .bio {
                color: #555;
                line-height: 1.5;
                margin-bottom: 20px;
            }
            .button {
                padding: 10px 20px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-weight: bold;
                transition: background-color 0.2s ease, transform 0.1s ease;
            }
            .btn-primary {
                background-color: #007bff;
                color: white;
                margin-right: 5px;
            }
            .btn-primary:hover {
                background-color: #0056b3;
            }
            .btn-secondary {
                background-color: #e4e6eb;
                color: #333;
            }
            .btn-secondary:hover {
                background-color: #d8dadf;
            }
            .button:active {
                transform: scale(0.96);
            }
        </style>
    </head>
    <body>
        <div class="profile-card">
            <img class="avata" src="avata.png" alt="Hình đại diện">
            <h1 class="name">Phạm Văn Hiếu</h1>
            <p class="title">Sinh viên</p>
            <p class="bio">Hello mọi người lại là mình hadkhongbayyy đây, hiện tại mình đang là một sinh viên IT, rất vui khi được gặp lại các bạn</p>
            <div>
                <button class="button btn-primary">Theo dõi</button>
                <button class="button btn-secondary">Nhắn tin</button>
            </div>
        </div>
    </body>
</html>
